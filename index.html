<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>편린</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="편린">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg: #12141B;
    --surface: #1B1E28;
    --surface-hover: #232635;
    --ink: #E8E6E1;
    --muted: #8B8E9E;
    --ember: #E3934F;
    --ember-dim: rgba(227,147,79,0.16);
    --thread: #7FB0A6;
    --thread-dim: rgba(127,176,166,0.14);
    --line: rgba(255,255,255,0.08);
    --error: #D97070;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif{ font-family: Georgia, "Nanum Myeongjo", "Batang", serif; }

  #app{ max-width: 480px; margin: 0 auto; min-height: 100%; display:flex; flex-direction:column; }

  header{ padding: 22px 20px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  header h1{ margin:0; font-size: 26px; font-weight: 500; letter-spacing: 0.01em; }
  header p{ margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height:1.5; }

  .gear-btn{
    background:none; border:1px solid var(--line); color: var(--muted);
    border-radius: 4px; width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:2px;
  }
  .gear-btn:hover{ background: var(--surface-hover); color: var(--ink); }

  .settings{
    margin: 0 20px 14px; padding: 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 4px; display:none;
  }
  .settings.open{ display:block; }
  .settings label{ font-size: 12px; color: var(--muted); display:block; margin-bottom:6px; }
  .settings input{
    width:100%; background: var(--bg); color: var(--ink); border:1px solid var(--line);
    border-radius:4px; padding:9px 10px; font-size:14px; font-family: inherit;
  }
  .settings .settings-row{ display:flex; gap:8px; margin-top:10px; }
  .settings button{
    background: var(--ember); color:#1A130B; border:none; border-radius:4px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .settings .hint{ margin-top:8px; font-size:12px; color: var(--muted); line-height:1.5; }
  .settings .saved-mark{ font-size:12px; color: var(--thread); align-self:center; }
  .settings-divider{ height:1px; background: var(--line); margin: 14px 0; }
  .settings #import-btn{ background: none; border: 1px solid var(--line); color: var(--ink); }

  .capture{
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 10px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  textarea{
    width:100%; resize: none; min-height: 64px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 13px; font-size: 15px; line-height:1.55;
    font-family: inherit;
  }
  textarea::placeholder{ color: var(--muted); }
  textarea:focus{ outline: none; border-color: rgba(227,147,79,0.5); }

  .image-preview{
    margin-top: 8px; position: relative; display:inline-block;
  }
  .image-preview img{ max-height: 96px; border-radius: 4px; display:block; border:1px solid var(--line); }
  .image-preview button{
    position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%;
    background: var(--surface); border:1px solid var(--line); color: var(--muted);
    font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0;
  }

  .capture-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .icon-btn{
    background: none; border:1px solid var(--line); color: var(--muted);
    border-radius: 4px; width: 38px; height: 38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{ background: var(--surface-hover); color: var(--ink); }

  .submit-btn{
    flex:1; background: var(--ember); color: #1A130B; border:none; border-radius: 4px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor:pointer;
    font-family: inherit;
  }
  .submit-btn:disabled{ opacity:0.45; cursor:default; }
  .submit-btn:not(:disabled):active{ transform: translateY(1px); }

  main{ flex:1; padding: 6px 20px 60px; }

  .view-toggle{ display:flex; gap:6px; padding: 12px 20px 0; }
  .view-btn{
    background:none; border:1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor:pointer; font-family: inherit;
  }
  .view-btn.active{ background: var(--ember-dim); border-color: rgba(227,147,79,0.4); color: var(--ember); }

  .view-panel{ display:none; }
  .view-panel.active{ display:block; }

  #mindmap-view{ padding: 10px 0 40px; }
  #mindmap-svg{ width:100%; height: 420px; display:block; touch-action: manipulation; }
  #mindmap-svg circle{ cursor:pointer; }
  #mindmap-svg line{ stroke: var(--line); stroke-width: 1; }

  .mindmap-empty{
    margin: 60px 20px 0; text-align:center; color: var(--muted); font-size: 14px; line-height:1.7;
  }

  .mindmap-info{
    margin: 4px 20px 0; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 4px; display:none;
  }
  .mindmap-info.open{ display:block; }
  .mindmap-info p{ margin:0 0 8px; font-size: 14px; line-height:1.6; }
  .mindmap-info .ts{ font-size:12px; color: var(--muted); margin-bottom:6px; }
  .mindmap-info button{
    background:none; border:1px solid rgba(227,147,79,0.5); color: var(--ember);
    border-radius:4px; padding:5px 11px; font-size:12px; cursor:pointer; font-family:inherit;
  }

  .empty{
    margin-top: 40px; text-align:center; color: var(--muted); font-size: 14px; line-height:1.7; padding: 0 10px;
  }

  .card{
    padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  .card.fresh{ animation: riseIn 0.5s ease; }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card-head{ display:flex; align-items:center; gap:8px; margin-bottom: 8px; }
  .dot{ width:6px; height:6px; border-radius:50%; background: var(--ember); flex-shrink:0; }
  .timestamp{ font-size: 12px; color: var(--muted); }

  .card-text{ font-size: 15px; line-height:1.6; white-space: pre-wrap; }
  .card img{ max-width: 100%; border-radius: 4px; margin-top: 8px; display:block; }

  .interp{
    margin-top: 12px; padding: 11px 13px;
    background: var(--thread-dim); border-left: 2px solid rgba(127,176,166,0.5);
    border-radius: 4px;
  }
  .interp .label{
    font-size: 11px; font-style: normal; color: var(--thread); margin: 0 0 6px;
  }
  .interp p{
    margin:0; font-size: 15px; line-height:1.7; font-style: italic; color: var(--ink);
  }
  .interp .waiting{ color: var(--muted); font-style: normal; font-size: 13px; display:flex; align-items:center; gap:8px; }
  .interp .failed{ color: var(--error); font-style: normal; font-size: 13px; }
  .interp .need-key{ color: var(--muted); font-style: normal; font-size: 13px; }
  .interp .need-key button{
    background:none; border:1px solid rgba(227,147,79,0.5); color: var(--ember);
    border-radius:4px; padding:3px 9px; font-size:12px; cursor:pointer; font-family:inherit; margin-left:6px;
  }

  .spinner{
    width:13px; height:13px; border-radius:50%;
    border: 2px solid rgba(227,147,79,0.25); border-top-color: var(--ember);
    animation: spin 0.8s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .connections{ margin-top: 10px; display:flex; flex-wrap:wrap; gap:6px; }

  .save-warning{
    margin-top: 10px; padding: 8px 10px; border-radius: 4px;
    background: rgba(217,112,112,0.1); border: 1px solid rgba(217,112,112,0.35);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size: 12px; color: var(--error);
  }
  .save-warning button{
    background: none; border: 1px solid rgba(217,112,112,0.5); color: var(--error);
    border-radius: 4px; padding: 4px 9px; font-size: 12px; cursor:pointer; flex-shrink:0;
    font-family: inherit;
  }
  .save-warning button:hover{ background: rgba(217,112,112,0.15); }
  .chip{
    font-size: 12px; color: var(--thread); background: var(--thread-dim);
    border: 1px solid rgba(127,176,166,0.35); border-radius: 999px;
    padding: 4px 10px; cursor:pointer; max-width: 220px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip:hover{ background: rgba(127,176,166,0.24); }

  .card.highlight{ background: rgba(227,147,79,0.06); border-radius: 6px; }

  #file-input{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 class="serif">편린</h1>
      <p>스치는 느낌, 장면, 단어를 그때그때 남겨두면 — 그 안에 있는 결과 조각들 사이의 이음을 짚어봐요.</p>
    </div>
    <button class="gear-btn" id="settings-toggle" title="API 키 설정" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </header>

  <div class="settings" id="settings-panel">
    <label for="api-key-input">Anthropic API 키</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-...">
    <div class="settings-row">
      <button id="save-key-btn" type="button">저장</button>
      <span class="saved-mark" id="key-saved-mark" style="display:none;">저장됨 ✓</span>
    </div>
    <p class="hint">이 브라우저에만 저장돼요. console.anthropic.com에서 발급받은 키를 넣어주세요.</p>
    <div class="settings-divider"></div>
    <label>데이터 옮기기</label>
    <div class="settings-row">
      <button id="export-btn" type="button">내보내기</button>
      <button id="import-btn" type="button">불러오기</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none;">
    <p class="hint">조각들을 파일로 내려받아두면, 나중에 다른 주소로 옮길 때 여기서 다시 불러올 수 있어요.</p>
  </div>

  <div class="capture">
    <textarea id="text-input" placeholder="지금 떠오른 걸 편하게 적어보세요…"></textarea>
    <div id="image-preview-wrap"></div>
    <div class="capture-row">
      <button class="icon-btn" id="attach-btn" title="사진 추가" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
      </button>
      <button class="submit-btn" id="submit-btn" type="button">조각 남기기</button>
    </div>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div class="view-toggle">
    <button class="view-btn active" data-view="list" type="button">기록</button>
    <button class="view-btn" data-view="map" type="button">마인드맵</button>
  </div>

  <main id="fragment-list" class="view-panel active">
    <div class="empty">아직 남긴 조각이 없어요.<br>방금 스친 느낌 하나부터 적어볼까요.</div>
  </main>

  <div id="mindmap-view" class="view-panel">
    <svg id="mindmap-svg"></svg>
    <div class="mindmap-info" id="mindmap-info"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'pyeollin_fragments';
  const API_KEY_STORAGE = 'pyeollin_api_key';

  let fragments = [];
  let pendingImage = null;
  let justAddedId = null;

  const textInput = document.getElementById('text-input');
  const submitBtn = document.getElementById('submit-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const previewWrap = document.getElementById('image-preview-wrap');
  const list = document.getElementById('fragment-list');
  const mindmapView = document.getElementById('mindmap-view');
  const mindmapSvg = document.getElementById('mindmap-svg');
  const mindmapInfo = document.getElementById('mindmap-info');
  const settingsToggle = document.getElementById('settings-toggle');
  const settingsPanel = document.getElementById('settings-panel');
  const apiKeyInput = document.getElementById('api-key-input');
  const saveKeyBtn = document.getElementById('save-key-btn');
  const keySavedMark = document.getElementById('key-saved-mark');

  function getApiKey(){
    try { return localStorage.getItem(API_KEY_STORAGE) || ''; }
    catch(e){ return ''; }
  }

  apiKeyInput.value = getApiKey();

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  saveKeyBtn.addEventListener('click', () => {
    try {
      localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
      keySavedMark.style.display = 'inline';
      setTimeout(() => { keySavedMark.style.display = 'none'; }, 1800);
      render();
    } catch (e) {
      console.error('API 키 저장 실패', e);
    }
  });

  const exportBtn = document.getElementById('export-btn');
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');

  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(fragments, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pyeollin-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const incoming = JSON.parse(ev.target.result);
        if (!Array.isArray(incoming)) throw new Error('형식이 올바르지 않아요');
        const byId = new Map();
        [...incoming, ...fragments].forEach(f => { if (f && f.id) byId.set(f.id, f); });
        fragments = Array.from(byId.values()).sort((a, b) => b.ts - a.ts);
        saveFragments();
        render();
        alert(`${incoming.length}개의 조각을 불러왔어요.`);
      } catch (err) {
        console.error(err);
        alert('파일을 읽는 데 문제가 생겼어요. 이전에 내보낸 JSON 파일이 맞는지 확인해주세요.');
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  function switchView(view){
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    list.classList.toggle('active', view === 'list');
    mindmapView.classList.toggle('active', view === 'map');
    if (view === 'map') renderMindmap();
    else mindmapInfo.classList.remove('open');
  }

  function computeGraph(){
    const byId = new Map(fragments.map(f => [f.id, f]));
    const edgeSet = new Set();
    const edges = [];
    fragments.forEach(f => {
      (f.connections || []).forEach(cid => {
        if (!byId.has(cid)) return;
        const key = [f.id, cid].sort().join('|');
        if (edgeSet.has(key)) return;
        edgeSet.add(key);
        edges.push({ a: f.id, b: cid });
      });
    });
    return { nodes: fragments.map(f => ({ id: f.id, ts: f.ts, text: f.text })), edges };
  }

  function simulate(nodes, edges, width, height){
    const idToNode = new Map(nodes.map(n => [n.id, n]));
    nodes.forEach((n, i) => {
      const angle = (i / nodes.length) * Math.PI * 2;
      n.x = width / 2 + Math.cos(angle) * 60 + (Math.random() - 0.5) * 20;
      n.y = height / 2 + Math.sin(angle) * 60 + (Math.random() - 0.5) * 20;
      n.vx = 0; n.vy = 0;
    });
    const iterations = Math.max(60, Math.min(180, Math.round(15000 / Math.max(nodes.length, 1))));
    for (let iter = 0; iter < iterations; iter++) {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const distSq = Math.max(dx * dx + dy * dy, 4);
          const dist = Math.sqrt(distSq);
          const force = 700 / distSq;
          const fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        }
      }
      edges.forEach(e => {
        const a = idToNode.get(e.a), b = idToNode.get(e.b);
        if (!a || !b) return;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const force = (dist - 85) * 0.02;
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      });
      nodes.forEach(n => {
        n.vx += (width / 2 - n.x) * 0.002;
        n.vy += (height / 2 - n.y) * 0.002;
        n.vx *= 0.82; n.vy *= 0.82;
        n.x += n.vx; n.y += n.vy;
        const pad = 22;
        n.x = Math.max(pad, Math.min(width - pad, n.x));
        n.y = Math.max(pad, Math.min(height - pad, n.y));
      });
    }
  }

  function lerpColor(c1, c2, t){
    return `rgb(${Math.round(c1[0] + (c2[0] - c1[0]) * t)},${Math.round(c1[1] + (c2[1] - c1[1]) * t)},${Math.round(c1[2] + (c2[2] - c1[2]) * t)})`;
  }

  function renderMindmap(){
    mindmapInfo.classList.remove('open');
    if (fragments.length < 2) {
      mindmapSvg.style.display = 'none';
      if (!mindmapView.querySelector('.mindmap-empty')) {
        const div = document.createElement('div');
        div.className = 'mindmap-empty';
        div.textContent = '조각이 몇 개 더 쌓이면 마인드맵이 그려져요.';
        mindmapView.insertBefore(div, mindmapInfo);
      }
      return;
    }
    const emptyMsg = mindmapView.querySelector('.mindmap-empty');
    if (emptyMsg) emptyMsg.remove();
    mindmapSvg.style.display = 'block';

    const width = mindmapSvg.clientWidth || 340;
    const height = 420;
    const { nodes, edges } = computeGraph();
    simulate(nodes, edges, width, height);

    const degree = new Map(nodes.map(n => [n.id, 0]));
    edges.forEach(e => {
      degree.set(e.a, (degree.get(e.a) || 0) + 1);
      degree.set(e.b, (degree.get(e.b) || 0) + 1);
    });

    const tsValues = nodes.map(n => n.ts);
    const minTs = Math.min(...tsValues), maxTs = Math.max(...tsValues);
    const OLD = [127, 176, 166], NEW = [227, 147, 79];

    const idToNode = new Map(nodes.map(n => [n.id, n]));
    const lines = edges.map(e => {
      const a = idToNode.get(e.a), b = idToNode.get(e.b);
      return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`;
    }).join('');

    const circles = nodes.map(n => {
      const t = maxTs > minTs ? (n.ts - minTs) / (maxTs - minTs) : 1;
      const color = lerpColor(OLD, NEW, t);
      const r = Math.min(6 + (degree.get(n.id) || 0) * 2.2, 17);
      return `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${color}" fill-opacity="0.85" data-id="${n.id}"></circle>`;
    }).join('');

    mindmapSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    mindmapSvg.innerHTML = lines + circles;

    mindmapSvg.querySelectorAll('circle').forEach(c => {
      c.addEventListener('click', () => showMindmapInfo(c.dataset.id));
    });
  }

  function showMindmapInfo(id){
    const f = fragments.find(x => x.id === id);
    if (!f) return;
    mindmapInfo.innerHTML = `
      <div class="ts">${formatTime(f.ts)}</div>
      <p>${escapeHtml(f.text ? (f.text.length > 60 ? f.text.slice(0, 60) + '…' : f.text) : '(사진 기록)')}</p>
      <button type="button" id="mindmap-goto">기록에서 보기</button>
    `;
    mindmapInfo.classList.add('open');
    document.getElementById('mindmap-goto').addEventListener('click', () => {
      switchView('list');
      requestAnimationFrame(() => {
        const el = document.getElementById('frag-' + id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('highlight');
          setTimeout(() => el.classList.remove('highlight'), 1400);
        }
      });
    });
  }

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingImage = await resizeImage(file);
      renderPreview();
    } catch (err) {
      console.error(err);
    }
    fileInput.value = '';
  });

  function renderPreview(){
    if (!pendingImage) { previewWrap.innerHTML = ''; return; }
    previewWrap.innerHTML = `
      <div class="image-preview">
        <img src="${pendingImage.dataUrl}">
        <button id="remove-image" type="button">×</button>
      </div>`;
    document.getElementById('remove-image').addEventListener('click', () => {
      pendingImage = null;
      renderPreview();
    });
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 480;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function loadFragments(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      fragments = raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('불러오기 실패', e);
      fragments = [];
    }
    render();
  }

  function saveFragments(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fragments));
      return true;
    } catch (e) {
      console.error('저장 실패', e);
      return false;
    }
  }

  submitBtn.addEventListener('click', handleSubmit);

  async function handleSubmit(){
    const text = textInput.value.trim();
    const image = pendingImage;
    if (!text && !image) return;

    const frag = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(),
      text,
      image: image ? image.dataUrl : null,
      interpretation: null,
      connections: [],
      status: getApiKey() ? 'loading' : 'need-key'
    };
    fragments.unshift(frag);
    justAddedId = frag.id;
    textInput.value = '';
    pendingImage = null;
    renderPreview();
    submitBtn.disabled = true;
    frag.saved = saveFragments();
    render();

    if (frag.status === 'loading') {
      await interpret(frag, image);
    }
    submitBtn.disabled = false;
  }

  async function interpret(frag, image){
    try {
      const apiKey = getApiKey();
      const history = fragments
        .filter(f => f.id !== frag.id && f.interpretation)
        .slice(0, 12);
      const historyLines = history
        .map((f, i) => `${i}. ${f.text ? f.text : '(사진 기록)'} → 그때 해석: ${f.interpretation}`)
        .join('\n');

      const content = [];
      if (image) {
        content.push({ type: 'image', source: { type: 'base64', media_type: image.mediaType, data: image.base64 } });
      }
      content.push({
        type: 'text',
        text: `새로 남긴 조각: ${frag.text ? frag.text : '(사진만 있음, 이미지를 보고 판단해줘)'}

지금까지 쌓인 조각들:
${historyLines || '(아직 없음)'}

너는 이 사람의 개인적인 직관 노트를 함께 들여다보는 역할이야. 새 조각 안에 있는 원리, 감각, 이치를 조심스럽게 짚어줘. 단정하지 말고, 가능성을 짚어보는 담백하고 시적인 톤으로 2~3문장, 한국어로.
그리고 위 목록 중 이 조각과 결이 닿아있다고 느껴지는 항목이 있으면 번호를 골라줘. 없으면 빈 배열로.

아래 JSON 형식으로만 응답해. 다른 설명이나 코드블록 없이:
{"interpretation": "...", "connectedIndices": [0, 2]}`
      });

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-5',
          max_tokens: 500,
          messages: [{ role: 'user', content }]
        })
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API 오류 ${response.status}: ${errText.slice(0, 200)}`);
      }
      const data = await response.json();
      const textOut = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');
      const clean = textOut.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      frag.interpretation = parsed.interpretation || '아직 뭐라 말하기 어려운 느낌이네요.';
      frag.connections = (parsed.connectedIndices || [])
        .map(i => history[i] && history[i].id)
        .filter(Boolean);
      frag.status = 'done';
    } catch (e) {
      console.error(e);
      frag.status = 'error';
    }
    frag.saved = saveFragments();
    render();
  }

  function formatTime(ts){
    const d = new Date(ts);
    return d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function shortLabel(f){
    if (f.text) return f.text.length > 16 ? f.text.slice(0, 16) + '…' : f.text;
    return '사진 기록';
  }

  function render(){
    if (fragments.length === 0) {
      list.innerHTML = '<div class="empty">아직 남긴 조각이 없어요.<br>방금 스친 느낌 하나부터 적어볼까요.</div>';
      return;
    }

    list.innerHTML = fragments.map(f => {
      const isFresh = f.id === justAddedId;
      let interpBlock = '';
      if (f.status === 'need-key') {
        interpBlock = `<div class="interp"><div class="need-key">API 키를 설정하면 해석을 받을 수 있어요.<button type="button" data-open-settings>키 설정하기</button></div></div>`;
      } else if (f.status === 'loading') {
        interpBlock = `<div class="interp"><div class="waiting"><span class="spinner"></span>조각을 살펴보는 중…</div></div>`;
      } else if (f.status === 'error') {
        interpBlock = `<div class="interp"><div class="failed">지금은 해석을 가져오지 못했어요.</div></div>`;
      } else if (f.interpretation) {
        const chips = (f.connections || []).map(cid => {
          const target = fragments.find(x => x.id === cid);
          if (!target) return '';
          return `<span class="chip" data-target="${cid}">${shortLabel(target)}</span>`;
        }).join('');
        interpBlock = `
          <div class="interp">
            <p class="label">AI가 짚어본 결</p>
            <p class="serif">${escapeHtml(f.interpretation)}</p>
            ${chips ? `<div class="connections">${chips}</div>` : ''}
          </div>`;
      }

      return `
        <div class="card ${isFresh ? 'fresh' : ''}" id="frag-${f.id}">
          <div class="card-head">
            <span class="dot"></span>
            <span class="timestamp">${formatTime(f.ts)}</span>
          </div>
          ${f.text ? `<div class="card-text">${escapeHtml(f.text)}</div>` : ''}
          ${f.image ? `<img src="${f.image}">` : ''}
          ${interpBlock}
          ${f.saved === false ? `
            <div class="save-warning">
              <span>아직 저장되지 않았어요.</span>
              <button type="button" data-retry="${f.id}">다시 저장</button>
            </div>` : ''}
        </div>`;
    }).join('');

    justAddedId = null;

    list.querySelectorAll('[data-retry]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = fragments.find(x => x.id === btn.dataset.retry);
        if (target) target.saved = saveFragments();
        render();
      });
    });

    list.querySelectorAll('[data-open-settings]').forEach(btn => {
      btn.addEventListener('click', () => {
        settingsPanel.classList.add('open');
        apiKeyInput.focus();
      });
    });

    list.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const target = document.getElementById('frag-' + chip.dataset.target);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('highlight');
          setTimeout(() => target.classList.remove('highlight'), 1400);
        }
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadFragments();
</script>
</body>
</html>
